<div class="progress" [style.transform]="'scaleX(' + progress + ')'" aria-hidden="true"></div>

<!-- ============================ NAVBAR ============================ -->
<header class="nav" [class.scrolled]="scrolled || menuOpen">
  <div class="wrap nav-inner">
    <a class="brand" routerLink="/" (click)="onHome && toTop()" aria-label="Amoli Technologies home">
      <img src="assets/brand/amoli-logo-white.svg" alt="Amoli Technologies" width="180" height="47">
    </a>

    <nav class="links" [class.open]="menuOpen" id="menu" aria-label="Main">
      <a *ngFor="let l of navLinks" [href]="'./#' + l.id" [class.active]="activeId === l.id" (click)="go(l.id, $event)">{{ l.label }}</a>
      <a class="btn btn-grad nav-cta" [href]="whatsappLink()" target="_blank" rel="noopener">Let's talk</a>
    </nav>

    <button type="button" class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
            aria-controls="menu" [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu-backdrop" *ngIf="menuOpen" (click)="menuOpen = false"></div>

<router-outlet></router-outlet>

<!-- ============================ FOOTER ============================ -->
<footer class="footer">
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="assets/brand/amoli-logo-white.svg" alt="Amoli Technologies" width="200" height="52" loading="lazy">
        <p>Software for schools, traders and growing businesses across India.</p>
      </div>
      <nav aria-label="Products">
        <h3>Products</h3>
        <a *ngFor="let p of products" [routerLink]="'/' + p.slug">{{ p.name }}</a>
      </nav>
      <nav aria-label="Company">
        <h3>Company</h3>
        <a href="./#services" (click)="go('services', $event)">Custom software</a>
        <a href="./#work" (click)="go('work', $event)">Client work</a>
        <a href="./#about" (click)="go('about', $event)">About</a>
        <a href="./#contact" (click)="go('contact', $event)">Contact</a>
      </nav>
      <div class="footer-contact">
        <h3>Contact</h3>
        <a [href]="whatsappLink()" target="_blank" rel="noopener">WhatsApp: {{ site.phoneDisplay }}</a>
        <a [href]="'mailto:' + site.email">{{ site.email }}</a>
        <span>{{ site.city }}</span>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© {{ year }} {{ site.name }}</span>
      <a *ngIf="site.linkedin" [href]="site.linkedin" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</footer>

<!-- Back to top -->
<button type="button" class="to-top" [class.show]="showTop" (click)="toTop()" aria-label="Back to top">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- Floating WhatsApp -->
